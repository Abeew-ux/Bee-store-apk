<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bee Store</title>
<meta name="description" content="Bee Store : catalogue d'applications Android, téléchargement direct.">
<meta name="theme-color" content="#5b3df5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark" aria-hidden="true">B</div>
    <div class="brand">Bee Store</div>
    <button class="iconbtn" id="goSearch" aria-label="Rechercher"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </header>

  <main>
    <section class="view" id="v-home"></section>

    <section class="view" id="v-catalog" hidden>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Rechercher une application" autocomplete="off" aria-label="Rechercher">
      </div>
      <div class="chips" id="chips" role="group" aria-label="Catégories"></div>
      <div class="toolbar">
        <span id="count"></span>
        <label>Trier <select id="sort">
          <option value="pop">Populaires</option>
          <option value="new">Récents</option>
          <option value="az">A à Z</option>
          <option value="size">Plus légers</option>
        </select></label>
      </div>
      <div class="list" id="results"></div>
    </section>

    <section class="view" id="v-favs" hidden>
      <div class="sec-head"><h2>Mes favoris</h2></div>
      <div class="list" id="favList"></div>
    </section>

    <section class="view" id="v-settings" hidden>
      <div class="sec-head"><h2>Réglages</h2></div>
      <div class="panel">
        <b>Apparence</b>
        <div class="seg" id="themeSeg">
          <button data-theme-set="auto" aria-pressed="true">Auto</button>
          <button data-theme-set="light" aria-pressed="false">Clair</button>
          <button data-theme-set="dark" aria-pressed="false">Sombre</button>
        </div>
      </div>
      <div class="panel">
        <b>Catalogue</b>
        <p class="note" id="status">Chargement…</p>
        <button class="btn soft" data-refresh>Actualiser</button>
      </div>
      <div class="panel">
        <b>À propos</b>
        <p class="note">Bee Store propose des applications Android en téléchargement direct. Vérifiez l'empreinte SHA-256 affichée sur chaque fiche si vous voulez contrôler le fichier.</p>
      </div>
    </section>
  </main>
</div>

<nav class="nav" aria-label="Navigation principale"><div class="nav-in">
  <button data-go="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-go="catalog"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Catalogue</button>
  <button data-go="favs"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Favoris</button>
  <button data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>Réglages</button>
</div></nav>

<div id="layer"></div>
<div id="toastBox" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
